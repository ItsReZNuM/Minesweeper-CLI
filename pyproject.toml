[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minesweeper-cli"
version = "0.2.2"
description = "A modern, beautiful, and interactive terminal Minesweeper game written in Python with Rich."
readme = "README.md"
authors = [
    { name = "ItsReZNuM" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "minesweeper",
    "cli",
    "terminal",
    "game",
    "rich",
    "cross-platform",
    "termux",
    "retro",
    "tui"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Terminals"
]
dependencies = [
    "rich>=13.0.0",
    "readchar>=4.0.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
minesweeper = "minesweeper_cli.cli:main"

[project.urls]
Homepage = "https://github.com/ItsReZNuM/Minesweeper-CLI"
Repository = "https://github.com/ItsReZNuM/Minesweeper-CLI"
Issues = "https://github.com/ItsReZNuM/Minesweeper-CLI/issues"
Changelog = "https://github.com/ItsReZNuM/Minesweeper-CLI/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minesweeper_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
